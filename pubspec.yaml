name: uroman
description: Universal Romanizer (uroman) in pure Dart. Converts text in virtually any script into Latin characters with high fidelity to upstream Python uroman.
version: 1.1.0
repository: https://github.com/ethnosdev/uroman
topics:
  - romanization
  - transliteration
  - unicode
  - linguistics
  - nlp

environment:
  sdk: ^3.13.5

# Add regular dependencies here.
dependencies:
  args: ^2.7.0
  # path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
